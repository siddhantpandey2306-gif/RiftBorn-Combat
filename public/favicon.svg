<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121A"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
    <linearGradient id="riftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3838"/>
      <stop offset="50%" stop-color="#D92626"/>
      <stop offset="100%" stop-color="#8A0F0F"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="#FF2B2B" stroke-width="2" stroke-opacity="0.35"/>
  
  <!-- Outer Hexagonal Rift Shard -->
  <polygon points="64,16 108,38 108,90 64,112 20,90 20,38" fill="url(#riftGrad)" stroke="#FF4D4D" stroke-width="2"/>
  
  <!-- Inner Cyber Core -->
  <polygon points="64,28 96,44 96,84 64,100 32,84 32,44" fill="#0A0D14"/>
  
  <!-- Central Lightning Rift Sigil -->
  <path d="M68,34 L44,66 L62,66 L56,94 L84,58 L66,58 Z" fill="url(#coreGrad)" filter="url(#glow)"/>
</svg>
